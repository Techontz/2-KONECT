name: app_2konect
description: "2KONECT — buy locally in Tanzania, or order it from abroad."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Media
  cached_network_image: ^3.4.1
  # Every banner an administrator has published is an SVG (image/svg+xml).
  # Flutter's own codecs handle PNG/JPEG/WebP/GIF and nothing else, so without
  # this the whole hero renders as an empty plate.
  flutter_svg: ^2.0.10
  flutter_cache_manager: ^3.4.1
  # Used to lift the copy layer out of a banner's artwork — see banner_image.dart.
  xml: ^6.5.0
  image_picker: ^1.1.2

  # Platform
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  intl: ^0.20.2
  share_plus: ^10.1.2

  # Identity — Firebase is the identity provider, Laravel/Sanctum the session.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

  # Plus Jakarta Sans — the website's typeface, bundled rather than fetched.
  # One family, five weights, nothing else: a second typeface would only make
  # the price and the product name argue with each other.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
