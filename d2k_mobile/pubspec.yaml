name: d2k_mobile
description: "Direct2Kariakoo (D2K) — Tanzania's premium online marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # Talks to the Laravel backend — the ecosystem's source of truth.
  http: ^1.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  # Opens WhatsApp and the phone dialer for seller contacts.
  url_launcher: ^6.3.1
  # Real map for the delivery-location picker.
  google_maps_flutter: ^2.9.0
  # Device position for "use my current location".
  geolocator: ^13.0.2
  # Turns a dropped pin into a street/area the backend can store.
  geocoding: ^3.0.0
  # Camera for the search scanner.
  image_picker: ^1.1.2
  # D2K banners are authored as SVG; Flutter's raster pipeline cannot decode
  # them, so they need a vector renderer.
  flutter_svg: ^2.0.10
  # Customer Google sign-in. The plugin returns an ID token which the Laravel
  # API verifies; the app never sees or holds a client secret.
  google_sign_in: ^6.2.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/products/

  fonts:
    # Manrope is the website's typeface. One family, one variable file: the
    # weight axis covers 200-800, so five static faces are replaced by 165 KB.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
